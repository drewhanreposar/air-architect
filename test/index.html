<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Air Architect — Gesture Test</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0b0f17; color: #e6edf7; font-family: system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); opacity: .6; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #top { position: fixed; top: calc(env(safe-area-inset-top) + 12px); left: 0; right: 0; text-align: center; pointer-events: none; }
  #label { display: inline-block; font-size: 26px; font-weight: 700; padding: 10px 22px; border-radius: 999px; background: rgba(11,15,23,.75); border: 1px solid #2a3550; color: #5ad1ff; }
  #sub { margin-top: 8px; font-size: 13px; color: #b8c4da; text-shadow: 0 1px 3px #000; }
  #ring { position: fixed; left: 50%; top: 50%; width: 120px; height: 120px; transform: translate(-50%,-50%); pointer-events: none; opacity: 0; transition: opacity .15s; }
  #log { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 12px); background: rgba(11,15,23,.8); border: 1px solid #2a3550; border-radius: 12px; padding: 10px 12px; font-size: 12px; line-height: 1.6; max-height: 30vh; overflow: hidden; }
  #log b { color: #ffd166; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0b0f17; z-index: 5; padding: 24px; text-align: center; }
  #start h1 { font-size: 28px; letter-spacing: 1px; } #start h1 span { color: #5ad1ff; }
  #start p { font-size: 14px; color: #8a97b0; max-width: 320px; line-height: 1.5; }
  #start button { font-size: 18px; padding: 14px 28px; border-radius: 12px; border: 0; background: #5ad1ff; color: #06121e; font-weight: 700; }
  #flip { position: fixed; right: 12px; top: calc(env(safe-area-inset-top) + 70px); font-size: 13px; padding: 8px 12px; border-radius: 10px; border: 1px solid #36507a; background: rgba(22,35,58,.85); color: #e6edf7; z-index: 3; }
</style>
</head>
<body>
<div id="stage"><video id="video" autoplay playsinline muted></video><canvas id="overlay"></canvas></div>

<div id="top"><div id="label">—</div><div id="sub">show your hand to the camera</div></div>
<svg id="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="#2a3550" stroke-width="8"/><circle id="arc" cx="50" cy="50" r="42" fill="none" stroke="#ffd166" stroke-width="8" stroke-linecap="round" stroke-dasharray="264" stroke-dashoffset="264" transform="rotate(-90 50 50)"/></svg>
<button id="flip">🔄 Flip camera</button>
<div id="log">Triggered gestures appear here.</div>

<div id="start">
  <h1>AIR <span>ARCHITECT</span></h1>
  <p>Gesture recognizer test. Allow camera access, then try: pinch, two-hand pinch, open palm, fist, peace ✌️, point ☝️, thumbs up 👍.</p>
  <button id="go">Start camera</button>
  <p id="err" style="color:#ff7a7a"></p>
</div>

<script type="module">
const video = document.getElementById('video');
const cv = document.getElementById('overlay'), ctx = cv.getContext('2d');
const labelEl = document.getElementById('label'), subEl = document.getElementById('sub');
const ring = document.getElementById('ring'), arc = document.getElementById('arc');
const logEl = document.getElementById('log');
let landmarker, facing = 'user', stream, lastT = -1;

async function openCam() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing, width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  video.srcObject = stream; await video.play();
  video.style.transform = facing === 'user' ? 'scaleX(-1)' : 'none';
}

document.getElementById('go').onclick = async () => {
  const err = document.getElementById('err');
  err.textContent = 'Loading hand model…';
  try {
    await openCam();
    const { FilesetResolver, HandLandmarker } = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const vision = await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    const opts = d => ({ baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: d }, runningMode: 'VIDEO', numHands: 2, minHandDetectionConfidence: .6, minTrackingConfidence: .5 });
    try { landmarker = await HandLandmarker.createFromOptions(vision, opts('GPU')); }
    catch { landmarker = await HandLandmarker.createFromOptions(vision, opts('CPU')); }
    document.getElementById('start').remove();
    loop();
  } catch (e) { err.textContent = 'Error: ' + e.message; }
};
document.getElementById('flip').onclick = async () => { facing = facing === 'user' ? 'environment' : 'user'; try { await openCam(); } catch (e) { log('camera flip failed'); } };

// ---------- Recognizer ----------
const d = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const pinchMem = [false, false];
const poseMem = [[], []];          // recent raw poses per hand, for stability voting

function classify(lm, i) {
  const size = d(lm[0], lm[9]) || 1e-3;
  const pr = d(lm[4], lm[8]) / size;
  pinchMem[i] = pinchMem[i] ? pr < 0.5 : pr < 0.32;          // hysteresis
  const ext = (tip, pip) => d(lm[0], lm[tip]) > d(lm[0], lm[pip]) * 1.12;
  const f = { i: ext(8, 6), m: ext(12, 10), r: ext(16, 14), p: ext(20, 18) };
  const thumbOut = d(lm[4], lm[9]) / size > 0.75;
  const thumbUp = lm[4].y < lm[3].y && lm[3].y < lm[2].y && (lm[2].y - lm[4].y) / size > 0.35;
  const n = f.i + f.m + f.r + f.p;

  let pose = 'none';
  if (pinchMem[i]) pose = 'pinch';
  else if (n === 0 && thumbUp && thumbOut) pose = 'thumbs';
  else if (n === 0) pose = 'fist';
  else if (n === 4) pose = 'palm';
  else if (f.i && f.m && !f.r && !f.p) pose = 'peace';
  else if (f.i && !f.m && !f.r && !f.p) pose = 'point';

  // stability: majority of last 5 frames
  const mem = poseMem[i]; mem.push(pose); if (mem.length > 5) mem.shift();
  const count = {}; mem.forEach(p => count[p] = (count[p] || 0) + 1);
  const stable = Object.entries(count).sort((a, b) => b[1] - a[1])[0][0];
  return { pose: stable, pt: { x: (lm[4].x + lm[8].x) / 2, y: (lm[4].y + lm[8].y) / 2 }, wrist: lm[0], size };
}

const NAMES = { pinch: '🤏 Pinch', thumbs: '👍 Thumbs up', fist: '✊ Fist', palm: '🖐 Open palm', peace: '✌️ Peace', point: '☝️ Point', none: '…' };
const HOLDS = { fist: ['Reset view', 900], peace: ['X-ray toggle', 700], point: ['Walk mode', 800], thumbs: ['Screenshot', 700] };
let hold = { name: '', t: 0, fired: false }, prev = null, mode = '';

function log(msg) {
  const t = new Date().toLocaleTimeString([], { minute: '2-digit', second: '2-digit' });
  logEl.innerHTML = `<b>${t}</b> ${msg}<br>` + logEl.innerHTML.split('<br>').slice(0, 6).join('<br>');
  if (navigator.vibrate) navigator.vibrate(40);
}

function recognize(hands) {
  const info = hands.map((h, i) => classify(h, i));
  const pinching = info.filter(h => h.pose === 'pinch').sort((a, b) => a.pt.x - b.pt.x);
  let label = hands.length ? NAMES[info[0].pose] : 'No hand', sub = '', holdName = '';

  if (pinching.length === 2) {
    const [a, b] = pinching;
    const cur = { dist: d(a.pt, b.pt), ang: Math.atan2(b.pt.y - a.pt.y, b.pt.x - a.pt.x) };
    label = '🤏🤏 Two-hand pinch';
    if (mode === 'two' && prev) {
      const zoom = cur.dist - prev.dist, twist = cur.ang - prev.ang;
      sub = Math.abs(zoom) > .006 ? (zoom > 0 ? 'ZOOM IN' : 'ZOOM OUT') : Math.abs(twist) > .02 ? (twist > 0 ? 'TWIST ↻' : 'TWIST ↺') : 'hold steady';
    }
    mode = 'two'; prev = cur;
  } else if (pinching.length === 1) {
    const p = pinching[0].pt;
    label = '🤏 Pinch → orbit';
    if (mode === 'one' && prev) {
      const dx = p.x - prev.x, dy = p.y - prev.y;
      sub = Math.hypot(dx, dy) < .004 ? 'hold steady' : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'ORBIT →' : 'ORBIT ←') : (dy > 0 ? 'TILT ↓' : 'TILT ↑');
    }
    mode = 'one'; prev = { ...p };
  } else {
    const palm = info.find(h => h.pose === 'palm');
    if (palm) {
      label = '🖐 Open palm → pan';
      if (mode === 'palm' && prev) {
        const dx = palm.wrist.x - prev.x, dy = palm.wrist.y - prev.y;
        sub = Math.hypot(dx, dy) < .006 ? 'slide to pan' : Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'PAN →' : 'PAN ←') : (dy > 0 ? 'PAN ↓ (section cut)' : 'PAN ↑');
      }
      mode = 'palm'; prev = { ...palm.wrist };
    } else {
      mode = ''; prev = null;
      const h = info.find(h => HOLDS[h.pose]);
      if (h) { holdName = h.pose; sub = 'hold for: ' + HOLDS[h.pose][0]; }
    }
  }

  // hold progress
  const now = performance.now();
  if (holdName) {
    if (hold.name !== holdName) hold = { name: holdName, t: now, fired: false };
    const [action, ms] = HOLDS[holdName];
    const prog = Math.min(1, (now - hold.t) / ms);
    ring.style.opacity = hold.fired ? 0 : 1;
    arc.setAttribute('stroke-dashoffset', 264 * (1 - prog));
    if (prog >= 1 && !hold.fired) { hold.fired = true; log('✅ ' + action); }
  } else { hold.name = ''; ring.style.opacity = 0; }

  labelEl.textContent = label;
  subEl.textContent = sub || (hands.length ? '' : 'show your hand to the camera');
  return info;
}

// ---------- Draw ----------
const LINKS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
function mapPoint(p) {
  // match object-fit: cover
  const W = cv.width, H = cv.height, vw = video.videoWidth, vh = video.videoHeight;
  const s = Math.max(W / vw, H / vh), ox = (W - vw * s) / 2, oy = (H - vh * s) / 2;
  return [p.x * vw * s + ox, p.y * vh * s + oy];
}
function draw(hands, info) {
  cv.width = cv.clientWidth * devicePixelRatio; cv.height = cv.clientHeight * devicePixelRatio;
  ctx.clearRect(0, 0, cv.width, cv.height);
  hands.forEach((h, i) => {
    const col = info[i].pose === 'pinch' ? '#ffd166' : '#5ad1ff';
    ctx.strokeStyle = col; ctx.lineWidth = 3 * devicePixelRatio; ctx.lineCap = 'round';
    LINKS.forEach(([a, b]) => { const A = mapPoint(h[a]), B = mapPoint(h[b]); ctx.beginPath(); ctx.moveTo(...A); ctx.lineTo(...B); ctx.stroke(); });
    ctx.fillStyle = '#fff';
    h.forEach(p => { const P = mapPoint(p); ctx.beginPath(); ctx.arc(...P, 3.5 * devicePixelRatio, 0, 7); ctx.fill(); });
  });
}

function loop() {
  if (video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    const res = landmarker.detectForVideo(video, performance.now());
    const mirror = facing === 'user';
    const hands = (res.landmarks || []).map(h => h.map(p => ({ x: mirror ? 1 - p.x : p.x, y: p.y })));
    const info = recognize(hands);
    draw(hands, info);
  }
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
